<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | FULL SOCCER</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth">
    <div class="tarjeta">
      <a href="/"><img class="logo" src="/img/logo.png" alt="FULL SOCCER"></a>
      <h1>Crear cuenta</h1>
      <p class="muted">Sigue a tu equipo favorito en FULL SOCCER</p>
      <div class="alerta error" id="error" hidden></div>
      <form id="form-registro" novalidate>
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" autocomplete="name" required minlength="3" maxlength="80">
        </div>
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" autocomplete="new-password" required maxlength="72">
          <ul class="reglas-pass" id="reglas"></ul>
        </div>
        <div class="campo">
          <label for="password2">Repite la contraseña</label>
          <input type="password" id="password2" autocomplete="new-password" required maxlength="72">
        </div>
        <button class="btn btn-primario" type="submit" id="btn">Registrarme</button>
        <a class="btn" href="/">Volver</a>
      </form>
      <p class="muted">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/password-rules.js"></script>
  <script src="/js/registro.js"></script>
</body>
</html>
