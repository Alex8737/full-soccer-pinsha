# Despliegue en Render (https://render.com) con "Blueprint"
services:
  - type: web
    name: full-soccer-pinsha
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/public/info
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@fullsoccer.ec
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
